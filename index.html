<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mã QR Sống Xanh</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #fef9c3;
      font-family: Arial, sans-serif;
    }
    .khung-qr {
      background-color: #ffffff;
      padding: 25px;
      border: 4px solid #15803d;
      border-radius: 16px;
      text-align: center;
    }
    h2 {
      color: #15803d;
      margin-top: 15px;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="khung-qr">
    <img src="https://qrserver.com" alt="Mã QR trang web">
    <h2>Quét mã để mở trang web</h2>
    <p>https://song-xanh-app.onrender.com/</p>
  </div>
</body>
</html>
