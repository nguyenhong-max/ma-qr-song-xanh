<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mã QR Sống Xanh</title>
  <script src="https://unpkg.com"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #fef9c3;
      font-family: Arial, sans-serif;
    }
    .khung-qr {
      background-color: #ffffff;
      padding: 25px;
      border: 4px solid #15803d;
      border-radius: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #ma-qr {
      margin-bottom: 15px;
    }
    h2 {
      color: #15803d;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="khung-qr">
    <div id="ma-qr"></div>
    <h2>Quét mã để mở trang web</h2>
    <p>https://onrender.com</p>
  </div>

  <script>
    new QRCode(document.getElementById("ma-qr"), {
      text: "https://onrender.com",
      width: 240,
      height: 240,
      colorDark : "#15803d",
      colorLight : "#ffffff"
    });
  </script>
</body>
</html>
